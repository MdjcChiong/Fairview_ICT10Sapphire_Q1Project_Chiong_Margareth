<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaKiss</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">ParaKiss</a>
        <div>
            <a class="btn btn-primary" href="sku.html">SKU Generator</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">ParaKiss</h2>

    <div class="row g-4">

        <div class="col-md-3">

                <img src="https://i.pinimg.com/736x/39/26/ef/3926efc8cf9ed6ca24ba69bc25ff679a.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Vivienne Westwood T-shirt</h5>
                    <p>₱1500</p>
                    <input type="checkbox" id="vivienne">
                    <label>Add to receipt</label>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">

                    <input type="checkbox" id="adidas">

                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">
                <img src="https://i.pinimg.com/1200x/8e/82/dc/8e82dc315861453647d24514744a4bb6.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Batman Graphic T-shirt</h5>
                    <p>₱450</p>
                    <input type="checkbox" id="batman">
                    <label>Add to receipt</label>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">

                <div class="card-body text-center">
                    <h5>Cherry Blossoms T-shirt</h5>
                    <p>₱550</p>
                    <input type="checkbox" id="cherry">
                    <label>Add to receipt</label>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card shadow">
                <img src="https://i.pinimg.com/1200x/de/05/1f/de051f7808048186b3f1b6406cba829e.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Ren T-shirt</h5>
                    <p>₱550</p>
                    <input type="checkbox" id="ren">
                    <label>Add to receipt</label>
                </div>
            </div>
        </div>

    </div>

    <div class="container receipt-box p-4 mt-5 rounded shadow">
        <h3>Receipt</h3>

        <input type="button" py-click="calculate_total" value="Calculate" class="btn btn-secondary">

        <div id="receipt" class="mt-3"></div>

        <div id="subtotal" class="mt-3"></div>
    </div>
</div>

<script type="py" src="main.py"></script>

</body>
</html>
