<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaKiss SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">ParaKiss</a>

        <div>
            <a class="btn btn-primary" href="index.html">Receipt</a>
        </div>
    </div>
</nav>

<div class="container bg-light p-4 mt-5 w-50 rounded shadow">

    <h3>SKU Generator</h3>

    <div class="mt-3">
        <label>Product Category</label>
        <select id="category" class="form-select">
            <option value="T-shirt">T-shirt</option>
            <option value="Polo">Polo</option>
        </select>
    </div>

    <div class="mt-3">
        <label>Product Name</label>
        <select id="product" class="form-select">
            <option value="Vivienne Westwood">Vivienne Westwood T-shirt</option>
            <option value="Amazing Spiderman">Amazing Spiderman T-shirt</option>
            <option value="Vintage D&C">Vintage D&C Polo</option>
            <option value="Dalmatian">Dalmatian T-shirt</option>
            <option value="Adidas">Blue Adidas T-shirt</option>
            <option value="Batman">Batman Graphic T-shirt</option>
            <option value="Cherry Blossoms">Cherry Blossoms T-shirt</option>
            <option value="Ren">Ren T-shirt</option>
        </select>
    </div>

    <div class="mt-3">
        <label>Stock Quantity</label>
        <input type="number" id="stock" class="form-control" min="1">
    </div>

    <div class="mt-3">
        <input type="button" py-click="generate_sku" value="Generate SKU" class="btn btn-secondary">
    </div>

    <div id="sku_result" class="mt-4" style="font-size:20px;"></div>

</div>

<script type="py" src="sku.py"></script>

</body>
</html>
